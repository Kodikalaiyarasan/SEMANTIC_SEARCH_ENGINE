server {
    listen 9092;
    server_name localhost;

    # Serve the React Frontend UI
    location / {
        root /usr/share/nginx/html;
        index standalone.html index.html;
        try_files $uri $uri/ /standalone.html;
    }

    # Reverse proxy backend API calls inside the Docker network!
    # /api/health -> http://semantic-search:9093/health
    # /api/search -> http://semantic-search:9093/search
    # /api/index  -> http://semantic-search:9093/index
    location /api/ {
        proxy_pass http://semantic-search:9093/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
