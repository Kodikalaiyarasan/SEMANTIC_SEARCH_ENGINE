<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semantic Search Engine</title>
  <!-- Load React and ReactDOM from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Load Babel Standalone to compile JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Simple beginner styling - plain, basic borders, no gradients, minimal color */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
      color: #333333;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background-color: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 4px;
    }

    h1 {
      font-size: 24px;
      color: #222222;
      margin-top: 0;
      border-bottom: 2px solid #333333;
      padding-bottom: 8px;
    }

    h2 {
      font-size: 18px;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .status-box {
      background-color: #f9f9f9;
      border: 1px solid #dddddd;
      padding: 10px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .status-indicator {
      font-weight: bold;
    }

    .status-ok {
      color: green;
    }

    .status-bad {
      color: red;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid #cccccc;
      padding-bottom: 8px;
    }

    .tab-btn {
      padding: 8px 16px;
      border: 1px solid #999999;
      background-color: #eeeeee;
      color: #333333;
      cursor: pointer;
      font-size: 14px;
      border-radius: 2px;
    }

    .tab-btn.active {
      background-color: #333333;
      color: #ffffff;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #999999;
      border-radius: 3px;
      font-size: 14px;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
    }

    button.submit-btn {
      padding: 8px 18px;
      background-color: #2b547e;
      color: #ffffff;
      border: 1px solid #1b3858;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
    }

    button.submit-btn:disabled {
      background-color: #cccccc;
      border-color: #aaaaaa;
      cursor: not-allowed;
    }

    .error-message {
      color: red;
      background-color: #ffe6e6;
      border: 1px solid #ffb3b3;
      padding: 10px;
      margin-top: 15px;
      border-radius: 3px;
      font-size: 14px;
    }

    .success-message {
      color: green;
      background-color: #e6ffe6;
      border: 1px solid #b3ffb3;
      padding: 10px;
      margin-top: 15px;
      border-radius: 3px;
      font-size: 14px;
    }

    .results-meta {
      font-size: 13px;
      color: #666666;
      margin-bottom: 12px;
    }

    .result-card {
      border: 1px solid #dddddd;
      background-color: #fafafa;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 3px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #cccccc;
      padding-bottom: 6px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .result-rank {
      font-weight: bold;
      color: #222222;
    }

    .result-score {
      font-weight: bold;
      color: #2b547e;
    }

    .result-text {
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .result-meta {
      font-size: 12px;
      color: #555555;
      background-color: #eeeeee;
      padding: 6px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('search');
      // Default to /api so it works seamlessly on Cloud, VMs, and localhost
      const [apiUrl, setApiUrl] = useState('/api');

      // Health check state
      const [healthStatus, setHealthStatus] = useState(null);
      const [healthLoading, setHealthLoading] = useState(false);

      // Search tab state
      const [searchQuery, setSearchQuery] = useState('');
      const [topK, setTopK] = useState(5);
      const [searchResults, setSearchResults] = useState(null);
      const [searchLoading, setSearchLoading] = useState(false);
      const [searchError, setSearchError] = useState('');

      // Index tab state
      const [docId, setDocId] = useState('');
      const [docText, setDocText] = useState('');
      const [docCategory, setDocCategory] = useState('');
      const [indexLoading, setIndexLoading] = useState(false);
      const [indexResult, setIndexResult] = useState(null);
      const [indexError, setIndexError] = useState('');

      const checkHealth = async () => {
        setHealthLoading(true);
        try {
          const response = await fetch(`${apiUrl}/health`);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const data = await response.json();
          setHealthStatus(data);
        } catch (err) {
          setHealthStatus({ status: 'offline', error: err.message });
        } finally {
          setHealthLoading(false);
        }
      };

      useEffect(() => {
        checkHealth();
      }, [apiUrl]);

      const handleSearch = async (e) => {
        e.preventDefault();
        if (!searchQuery.trim()) {
          alert('Please enter a search query');
          return;
        }

        setSearchLoading(true);
        setSearchError('');
        setSearchResults(null);

        try {
          const response = await fetch(`${apiUrl}/search`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              query: searchQuery,
              top_k: Number(topK),
            }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || 'Search request failed');
          }
          setSearchResults(data);
        } catch (err) {
          setSearchError(err.message);
        } finally {
          setSearchLoading(false);
        }
      };

      const handleIndexDocument = async (e) => {
        e.preventDefault();
        if (!docId.trim() || !docText.trim()) {
          alert('Please fill out both ID and Text fields');
          return;
        }

        setIndexLoading(true);
        setIndexError('');
        setIndexResult(null);

        const payload = {
          documents: [
            {
              id: docId.trim(),
              text: docText.trim(),
              metadata: docCategory.trim() ? { category: docCategory.trim() } : {},
            },
          ],
        };

        try {
          const response = await fetch(`${apiUrl}/index`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || 'Index request failed');
          }
          setIndexResult(data);
          setDocId('');
          setDocText('');
          setDocCategory('');
          checkHealth();
        } catch (err) {
          setIndexError(err.message);
        } finally {
          setIndexLoading(false);
        }
      };

      return (
        <div className="container">
          <h1>Semantic Search Engine</h1>
          <p style={{ fontSize: '13px', color: '#555555' }}>
            A simple React frontend to query and add documents to your FastAPI + FAISS semantic search engine.
          </p>

          {/* Backend Connection & Status Box */}
          <div className="status-box">
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '8px' }}>
              <div>
                <strong>Backend API: </strong>
                <input
                  type="text"
                  value={apiUrl}
                  onChange={(e) => setApiUrl(e.target.value)}
                  style={{ width: '220px', padding: '4px', fontSize: '13px' }}
                />
                <button
                  onClick={checkHealth}
                  disabled={healthLoading}
                  style={{ marginLeft: '8px', padding: '4px 10px', fontSize: '12px', cursor: 'pointer' }}
                >
                  {healthLoading ? 'Checking...' : 'Check Status'}
                </button>
              </div>
              <div>
                Status:{' '}
                <span
                  className={`status-indicator ${
                    healthStatus && healthStatus.status === 'healthy' ? 'status-ok' : 'status-bad'
                  }`}
                >
                  {healthStatus ? healthStatus.status.toUpperCase() : 'UNKNOWN'}
                </span>
              </div>
            </div>

            {healthStatus && healthStatus.status === 'healthy' && (
              <div style={{ fontSize: '12px', color: '#444444' }}>
                Loaded Model: <code>{healthStatus.model_name}</code> | Total Vectors Indexed: <b>{healthStatus.index_size}</b>
              </div>
            )}
            {healthStatus && healthStatus.status !== 'healthy' && (
              <div style={{ fontSize: '12px', color: 'red' }}>
                Could not connect to FastAPI server at {apiUrl}. Make sure your backend is running.
              </div>
            )}
          </div>

          {/* Navigation Tabs */}
          <div className="nav-tabs">
            <button
              className={`tab-btn ${activeTab === 'search' ? 'active' : ''}`}
              onClick={() => setActiveTab('search')}
            >
              1. Search Documents
            </button>
            <button
              className={`tab-btn ${activeTab === 'index' ? 'active' : ''}`}
              onClick={() => setActiveTab('index')}
            >
              2. Add Document
            </button>
          </div>

          {/* TAB 1: SEARCH */}
          {activeTab === 'search' && (
            <div>
              <h2>Search Queries</h2>
              <form onSubmit={handleSearch}>
                <div className="form-group">
                  <label>Enter Query:</label>
                  <input
                    type="text"
                    placeholder="e.g. How does Docker containerization work?"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                  />
                </div>

                <div className="form-group" style={{ width: '150px' }}>
                  <label>Top Results (k):</label>
                  <input
                    type="number"
                    min="1"
                    max="50"
                    value={topK}
                    onChange={(e) => setTopK(e.target.value)}
                  />
                </div>

                <button type="submit" className="submit-btn" disabled={searchLoading}>
                  {searchLoading ? 'Searching...' : 'Search'}
                </button>
              </form>

              {searchError && (
                <div className="error-message">
                  <b>Error:</b> {searchError}
                </div>
              )}

              {searchResults && (
                <div style={{ marginTop: '20px' }}>
                  <h2>Search Results</h2>
                  <div className="results-meta">
                    Found {searchResults.results.length} result(s) in {searchResults.latency_ms} ms for query: "
                    <b>{searchResults.query}</b>"
                  </div>

                  {searchResults.results.length === 0 ? (
                    <p>No matching results found.</p>
                  ) : (
                    searchResults.results.map((item) => (
                      <div key={item.document_id + item.rank} className="result-card">
                        <div className="result-header">
                          <span className="result-rank">
                            #{item.rank} - ID: {item.document_id}
                          </span>
                          <span className="result-score">
                            Cosine Similarity: {(item.score * 100).toFixed(1)}% ({item.score.toFixed(4)})
                          </span>
                        </div>
                        <div className="result-text">{item.text}</div>
                        {item.metadata && Object.keys(item.metadata).length > 0 && (
                          <div className="result-meta">
                            <strong>Metadata:</strong> {JSON.stringify(item.metadata)}
                          </div>
                        )}
                      </div>
                    ))
                  )}
                </div>
              )}
            </div>
          )}

          {/* TAB 2: INDEX */}
          {activeTab === 'index' && (
            <div>
              <h2>Add / Index New Document</h2>
              <form onSubmit={handleIndexDocument}>
                <div className="form-group">
                  <label>Document ID:</label>
                  <input
                    type="text"
                    placeholder="e.g. doc-101"
                    value={docId}
                    onChange={(e) => setDocId(e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label>Document Text:</label>
                  <textarea
                    rows="4"
                    placeholder="Enter text content to embed into vector space..."
                    value={docText}
                    onChange={(e) => setDocText(e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label>Category (Optional Metadata):</label>
                  <input
                    type="text"
                    placeholder="e.g. devops, machine-learning, database"
                    value={docCategory}
                    onChange={(e) => setDocCategory(e.target.value)}
                  />
                </div>

                <button type="submit" className="submit-btn" disabled={indexLoading}>
                  {indexLoading ? 'Indexing...' : 'Index Document'}
                </button>
              </form>

              {indexError && (
                <div className="error-message">
                  <b>Error:</b> {indexError}
                </div>
              )}

              {indexResult && (
                <div className="success-message">
                  <b>Success:</b> Indexed {indexResult.indexed} document. Total vectors in index is now{' '}
                  {indexResult.total_index_size}.
                </div>
              )}
            </div>
          )}

          <hr style={{ marginTop: '30px', borderColor: '#eeeeee' }} />
          <div style={{ textAlign: 'center', fontSize: '11px', color: '#888888' }}>
            Semantic Search UI &bull; Running on Port 9092
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
