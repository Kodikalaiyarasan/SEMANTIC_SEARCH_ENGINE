<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semantic Search Engine</title>
  <!-- React 18 & ReactDOM from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone to compile JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
      color: #333333;
    }

    .container {
      max-width: 860px;
      margin: 25px auto;
      padding: 24px;
      background-color: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 6px;
    }

    h1 {
      font-size: 24px;
      color: #222222;
      margin-top: 0;
      border-bottom: 2px solid #333333;
      padding-bottom: 8px;
    }

    h2 {
      font-size: 18px;
      margin-top: 18px;
      margin-bottom: 12px;
      color: #222222;
    }

    .status-box {
      background-color: #f9f9f9;
      border: 1px solid #dddddd;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 13px;
      border-radius: 4px;
    }

    .status-indicator {
      font-weight: bold;
    }

    .status-ok {
      color: #1b7a2e;
    }

    .status-bad {
      color: #c92a2a;
    }

    .model-selector-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #dddddd;
    }

    select.model-select {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #999999;
      border-radius: 3px;
      font-size: 13px;
      background-color: #ffffff;
      font-weight: 500;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid #dddddd;
      padding-bottom: 8px;
    }

    .tab-btn {
      padding: 9px 18px;
      border: 1px solid #999999;
      background-color: #eeeeee;
      color: #333333;
      cursor: pointer;
      font-size: 14px;
      border-radius: 3px;
      font-weight: 500;
    }

    .tab-btn.active {
      background-color: #2b547e;
      color: #ffffff;
      border-color: #1b3858;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 6px;
      color: #333333;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 9px;
      border: 1px solid #999999;
      border-radius: 3px;
      font-size: 14px;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 13px;
    }

    button.submit-btn {
      padding: 9px 20px;
      background-color: #2b547e;
      color: #ffffff;
      border: 1px solid #1b3858;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    button.submit-btn:disabled {
      background-color: #cccccc;
      border-color: #aaaaaa;
      cursor: not-allowed;
    }

    .error-message {
      color: #a00;
      background-color: #ffeaea;
      border: 1px solid #ffbaba;
      padding: 10px;
      margin-top: 14px;
      border-radius: 3px;
      font-size: 13px;
    }

    .success-message {
      color: #155724;
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
      padding: 10px;
      margin-top: 14px;
      border-radius: 3px;
      font-size: 13px;
    }

    .results-meta {
      font-size: 13px;
      color: #555555;
      margin-bottom: 14px;
      background-color: #f0f4f8;
      padding: 8px 12px;
      border-left: 3px solid #2b547e;
    }

    .result-card {
      border: 1px solid #cccccc;
      background-color: #ffffff;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 4px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eeeeee;
      padding-bottom: 8px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .result-rank {
      font-weight: bold;
      color: #222222;
    }

    .result-score {
      font-weight: bold;
      color: #1b5e20;
    }

    .result-text {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .code-preview {
      background-color: #f7f9fb;
      border: 1px solid #e1e4e8;
      border-radius: 3px;
      padding: 10px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 13px;
      overflow-x: auto;
    }

    .badge {
      display: inline-block;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 3px;
      background-color: #2b547e;
      color: #ffffff;
      margin-right: 6px;
    }

    .badge-code {
      background-color: #0d6efd;
    }

    .badge-doc {
      background-color: #6c757d;
    }

    /* Documents tab styles */
    .docs-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .docs-toolbar input {
      flex: 1;
      padding: 7px 10px;
      font-size: 13px;
    }

    .doc-item-card {
      border: 1px solid #dddddd;
      background-color: #fafafa;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 3px;
    }

    .doc-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .doc-id-label {
      font-weight: bold;
      font-size: 13px;
      color: #2b547e;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('search');
      const [apiUrl, setApiUrl] = useState('/api');

      // Health & Model states
      const [healthStatus, setHealthStatus] = useState(null);
      const [healthLoading, setHealthLoading] = useState(false);
      const [selectedModel, setSelectedModel] = useState('fine_tuned');
      const [modelSwitching, setModelSwitching] = useState(false);
      const [modelMessage, setModelMessage] = useState('');

      // Search tab state
      const [searchQuery, setSearchQuery] = useState('');
      const [topK, setTopK] = useState(5);
      const [searchResults, setSearchResults] = useState(null);
      const [searchLoading, setSearchLoading] = useState(false);
      const [searchError, setSearchError] = useState('');

      // Index tab state (Document ID + Text only, no metadata)
      const [docId, setDocId] = useState('');
      const [docText, setDocText] = useState('');
      const [indexLoading, setIndexLoading] = useState(false);
      const [indexResult, setIndexResult] = useState(null);
      const [indexError, setIndexError] = useState('');

      // Documents view tab state
      const [documents, setDocuments] = useState([]);
      const [docsLoading, setDocsLoading] = useState(false);
      const [docsError, setDocsError] = useState('');
      const [docFilter, setDocFilter] = useState('');

      // Health check & model sync
      const checkHealth = async () => {
        setHealthLoading(true);
        try {
          const response = await fetch(`${apiUrl}/health`);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const data = await response.json();
          setHealthStatus(data);
          if (data.model_id) {
            setSelectedModel(data.model_id);
          }
        } catch (err) {
          setHealthStatus({ status: 'offline', error: err.message });
        } finally {
          setHealthLoading(false);
        }
      };

      useEffect(() => {
        checkHealth();
      }, [apiUrl]);

      // Load documents list
      const fetchDocuments = async () => {
        setDocsLoading(true);
        setDocsError('');
        try {
          const response = await fetch(`${apiUrl}/documents`);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const data = await response.json();
          setDocuments(data.documents || []);
        } catch (err) {
          setDocsError(err.message);
        } finally {
          setDocsLoading(false);
        }
      };

      useEffect(() => {
        if (activeTab === 'documents') {
          fetchDocuments();
        }
      }, [activeTab, apiUrl]);

      // Handle model switch
      const handleModelChange = async (newModelId) => {
        setSelectedModel(newModelId);
        setModelSwitching(true);
        setModelMessage('');
        try {
          const response = await fetch(`${apiUrl}/model/switch`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model_id: newModelId }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || 'Failed to switch model');
          }
          setModelMessage(`Active model switched to: ${data.active_model_name}`);
          checkHealth();
        } catch (err) {
          alert('Model switch error: ' + err.message);
        } finally {
          setModelSwitching(false);
        }
      };

      // Handle Search
      const handleSearch = async (e) => {
        e.preventDefault();
        if (!searchQuery.trim()) {
          alert('Please enter a search query');
          return;
        }

        setSearchLoading(true);
        setSearchError('');
        setSearchResults(null);

        try {
          const response = await fetch(`${apiUrl}/search`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              query: searchQuery.trim(),
              top_k: Number(topK),
              model_id: selectedModel,
            }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || 'Search request failed');
          }
          setSearchResults(data);
        } catch (err) {
          setSearchError(err.message);
        } finally {
          setSearchLoading(false);
        }
      };

      // Handle Document Indexing (ID + Text only)
      const handleIndexDocument = async (e) => {
        e.preventDefault();
        if (!docId.trim() || !docText.trim()) {
          alert('Please fill out both ID and Text fields');
          return;
        }

        setIndexLoading(true);
        setIndexError('');
        setIndexResult(null);

        const payload = {
          documents: [
            {
              id: docId.trim(),
              text: docText.trim(),
            },
          ],
        };

        try {
          const response = await fetch(`${apiUrl}/index`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || 'Index request failed');
          }
          setIndexResult(data);
          setDocId('');
          setDocText('');
          checkHealth();
          if (activeTab === 'documents') {
            fetchDocuments();
          }
        } catch (err) {
          setIndexError(err.message);
        } finally {
          setIndexLoading(false);
        }
      };

      // Filtered documents for View Documents tab
      const filteredDocs = documents.filter((doc) => {
        if (!docFilter.trim()) return true;
        const q = docFilter.toLowerCase();
        return (
          doc.id.toLowerCase().includes(q) ||
          doc.text.toLowerCase().includes(q)
        );
      });

      return (
        <div className="container">
          <h1>Semantic Search Engine</h1>
          <p style={{ fontSize: '13px', color: '#555555', marginTop: '4px' }}>
            Dense-vector retrieval powered by SentenceTransformers &amp; FAISS. Search across technical documentation and Python code implementations.
          </p>

          {/* Backend Connection & Model Selector Box */}
          <div className="status-box">
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '8px' }}>
              <div>
                <strong>Backend API: </strong>
                <input
                  type="text"
                  value={apiUrl}
                  onChange={(e) => setApiUrl(e.target.value)}
                  style={{ width: '180px', padding: '4px 6px', fontSize: '13px' }}
                />
                <button
                  onClick={checkHealth}
                  disabled={healthLoading}
                  style={{ marginLeft: '8px', padding: '4px 10px', fontSize: '12px', cursor: 'pointer' }}
                >
                  {healthLoading ? 'Checking...' : 'Check Status'}
                </button>
              </div>
              <div>
                Status:{' '}
                <span
                  className={`status-indicator ${hStatus.status === 'healthy' ? 'status-ok' : 'status-bad'
                    }                     >
                  {healthStatus ? healthStatus.status.toUpperCase() : 'UNKNOWN'}
                </span>
                {healthStatus && healthStatus.status === 'healthy' && (
                  <span style={{ marginLeft: '10px', color: '#555' }}>
                    (<b>{healthStatus.index_size}</b> vectors indexed)
                  </span>
                )}
              </div>
            </div>

            {/* Model Selector Feature */}
            <div className="model-selector-row">
              <label style={{ margin: 0, whiteSpace: 'nowrap' }}>
                🧠 <strong>Choose Model:</strong>
              </label>
              <select
                className="model-select"
                value={selectedModel}
                disabled={modelSwitching}
                onChange={(e) => handleModelChange(e.target.value)}
              >
                <option value="fine_tuned">
                  🚀 Fine-Tuned Model v2 (Kodikalaiyarasan/all-MiniLM-L6-v2-tech-code-search-v2)
                </option>
                <option value="base">
                  📦 Base Model (sentence-transformers/all-MiniLM-L6-v2)
                </option>
              </select>
              {modelSwitching && <span style={{ fontSize: '12px', color: '#666' }}>Switching model...</span>}
            </div>

            {modelMessage && (
              <div style={{ fontSize: '12px', color: '#155724', marginTop: '6px' }}>
                ✓ {modelMessage}
              </div>
            )}
            {healthStatus && healthStatus.status !== 'healthy' && (
              <div style={{ fontSize: '12px', color: '#c92a2a', marginTop: '6px' }}>
                Could not connect to FastAPI server at {apiUrl}. Make sure your backend is running.
              </div>
            )}
          </div>

          {/* Navigation Tabs */}
          <div className="nav-tabs">
            <button
              className={`tab-btn ${activeTab === 'search' ? 'active' : ''}`}
              onClick={() => setActiveTab('search')}
            >
              🔍 1. Search
            </button>
            <button
              className={`tab-btn ${activeTab === 'index' ? 'active' : ''}`}
              onClick={() => setActiveTab('index')}
            >
              ➕ 2. Add Document
            </button>
            <button
              className={`tab-btn ${activeTab === 'documents' ? 'active' : ''}`}
              onClick={() => setActiveTab('documents')}
            >
              📄 3. View Documents {documents.length > 0 ? `(${documents.length})` : ''}
            </button>
          </div>

          {/* TAB 1: SEARCH */}
          {activeTab === 'search' && (
            <div>
              <h2>Search Documents &amp; Code</h2>
              <form onSubmit={handleSearch}>
                <div className="form-group">
                  <label>Enter Query (Natural Language or Code Search):</label>
                  <input
                    type="text"
                    placeholder="e.g. binary search in sorted array, or how do transformers process sequential data?"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                  />
                </div>

                <div className="form-group" style={{ width: '150px' }}>
                  <label>Top Results (k):</label>
                  <input
                    type="number"
                    min="1"
                    max="50"
                    value={topK}
                    onChange={(e) => setTopK(e.target.value)}
                  />
                </div>

                <button type="submit" className="submit-btn" disabled={searchLoading}>
                  {searchLoading ? 'Searching...' : 'Search'}
                </button>
              </form>

              {searchError && (
                <div className="error-message">
                  <b>Error:</b> {searchError}
                </div>
              )}

              {searchResults && (
                <div style={{ marginTop: '22px' }}>
                  <h2>Search Results</h2>
                  <div className="results-meta">
                    Found <b>{searchResults.results.length}</b> result(s) in <b>{searchResults.latency_ms} ms</b> using model:{' '}
                    <code>{searchResults.model_name}</code>
                  </div>

                  {searchResults.results.length === 0 ? (
                    <p>No matching results found.</p>
                  ) : (
                    searchResults.results.map((item) => {
                      const isCode = item.document_id.startsWith('code-') || item.text.includes('def ') || item.text.includes('class ');
                      return (
                        <div key={item.document_id + item.rank} className="result-card">
                          <div className="result-header">
                            <div>
                              <span className={`badge ${isCode ? 'badge-code' : 'badge-doc'}`}>
                                {isCode ? 'CODE' : 'DOC'}
                              </span>
                              <span className="result-rank">
                                #{item.rank} &bull; {item.document_id}
                              </span>
                            </div>
                            <span className="result-score">
                              Cosine Similarity: {(item.score * 100).toFixed(1)}% ({item.score.toFixed(4)})
                            </span>
                          </div>
                          <div className={isCode ? 'code-preview' : 'result-text'}>
                            {item.text}
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              )}
            </div>
          )}

          {/* TAB 2: INDEX (No metadata asked from UI) */}
          {activeTab === 'index' && (
            <div>
              <h2>Add / Index New Document</h2>
              <p style={{ fontSize: '13px', color: '#666', marginTop: 0 }}>
                Embed and index new text or code into the FAISS vector space.
              </p>
              <form onSubmit={handleIndexDocument}>
                <div className="form-group">
                  <label>Document ID:</label>
                  <input
                    type="text"
                    placeholder="e.g. doc-101 or code-021"
                    value={docId}
                    onChange={(e) => setDocId(e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label>Document Text / Code:</label>
                  <textarea
                    rows="6"
                    placeholder="Enter text or Python code implementation to embed into vector space..."
                    value={docText}
                    onChange={(e) => setDocText(e.target.value)}
                  />
                </div>

                <button type="submit" className="submit-btn" disabled={indexLoading}>
                  {indexLoading ? 'Indexing...' : 'Index Document'}
                </button>
              </form>

              {indexError && (
                <div className="error-message">
                  <b>Error:</b> {indexError}
                </div>
              )}

              {indexResult && (
                <div className="success-message">
                  <b>Success:</b> Indexed {indexResult.indexed} document. Total vectors in index is now{' '}
                  {indexResult.total_index_size}.
                </div>
              )}
            </div>
          )}

          {/* TAB 3: VIEW DOCUMENTS */}
          {activeTab === 'documents' && (
            <div>
              <h2>Corpus Documents</h2>
              <p style={{ fontSize: '13px', color: '#666', marginTop: 0 }}>
                Browse all documents and code implementations currently stored in the search index.
              </p>

              <div className="docs-toolbar">
                <input
                  type="text"
                  placeholder="Filter by ID or content (e.g. 'code', 'docker', 'sort')..."
                  value={docFilter}
                  onChange={(e) => setDocFilter(e.target.value)}
                />
                <button
                  onClick={fetchDocuments}
                  disabled={docsLoading}
                  style={{ padding: '7px 14px', fontSize: '13px', cursor: 'pointer' }}
                >
                  {docsLoading ? 'Refreshing...' : '🔄 Refresh'}
                </button>
              </div>

              {docsError && (
                <div className="error-message">
                  <b>Error:</b> {docsError}
                </div>
              )}

              <div style={{ fontSize: '13px', color: '#666', marginBottom: '10px' }}>
                Showing <b>{filteredDocs.length}</b> of <b>{documents.length}</b> total documents
              </div>

              {filteredDocs.length === 0 && !docsLoading && (
                <p style={{ color: '#888' }}>No documents matched your filter.</p>
              )}

              <div>
                {filteredDocs.map((doc, idx) => {
                  const isCode = doc.id.startsWith('code-') || doc.text.includes('def ') || doc.text.includes('class ');
                  return (
                    <div key={doc.id} className="doc-item-card">
                      <div className="doc-item-header">
                        <div>
                          <span className={`badge ${isCode ? 'badge-code' : 'badge-doc'}`}>
                            {isCode ? 'CODE' : 'DOC'}
                          </span>
                          <span className="doc-id-label">{doc.id}</span>
                        </div>
                        <span style={{ fontSize: '11px', color: '#888' }}>
                          #{idx + 1} &bull; {doc.text.length} chars
                        </span>
                      </div>
                      <div className={isCode ? 'code-preview' : 'result-text'} style={{ fontSize: '13px' }}>
                        {doc.text}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <hr style={{ marginTop: '30px', borderColor: '#eeeeee' }} />
          <div style={{ textAlign: 'center', fontSize: '11px', color: '#888888' }}>
            Semantic Search Engine &bull; Serving on Port 9092
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
